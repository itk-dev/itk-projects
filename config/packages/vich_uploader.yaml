vich_uploader:
  db_driver: orm

  # Files are stored outside the web root and served through an
  # authenticated controller (App\Controller\MediaController).
  mappings:
    project_image:
      uri_prefix: /media/project-images
      upload_destination: '%kernel.project_dir%/var/uploads/project-images'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
    project_attachment:
      uri_prefix: /media/project-attachments
      upload_destination: '%kernel.project_dir%/var/uploads/project-attachments'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
