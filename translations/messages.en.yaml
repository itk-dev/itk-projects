        blanks: "“%title%” is %percent%% filled in — a few blanks to go. 📝"
        ending: "“%title%” is %percent%% done. Give it the ending it deserves! 🏁"
        strong: "“%title%” is %percent%% there — let’s finish strong! 💪"
    finish_cta: Finish it
    contact:
        details: "“%name%” is still missing details — shall we finish the contact?"
        quick: "You added “%name%” on the fly — want to fill in the rest? ✏️"
        name_only: "“%name%” only has a name so far. Shall we add the details?"
    msg:
        idea: "Got a fresh idea? Let’s give it a home. ✨"
        roll: "You’re on a roll — what’s next?"
        bold: "Every great project starts with one bold line."
        creativity: "Your creativity makes all the difference. 🌟"
        another: "Another project? Yes please!"
        draft: "Don’t let that draft gather dust — wrap it up."
        future: "Look at you, shaping the future."
        spark: "Every big change needs a first spark — got one? ⚡"
        dream: "Dream big. The form can take it. 💭"
        coffee: "A coffee and five minutes is all an idea needs. ☕"
        small: "No idea is too small to write down."
        colleague: "Somewhere a colleague needs exactly your idea. 🤝"
        today: "Today’s a great day to start something new."
        create: "Be the one who hits the create button. 🚀"
        thought: "That thought you keep having? Give it a home here. 📝"
        momentum: "One idea today, momentum tomorrow."
        curious: "Curious what you’ll come up with next. 👀"
    play:
        invite: "Psst… up for a game of catch? 🌟"
        start: "Play catch"
        caught: "Haha, you got me! Now it's my turn 😈"
        gotcha: "Gotcha! That was fun. Anyway, back to work. 🎉"
        giveup: "Phew… let's call it a draw. 😅"
        escaped: "Argh, you got away! Too quick for me. 🏳️"

tour:
    propose: "Welcome! Shall I give you a quick tour of the platform?"
    start: "Yes, show me around"
    decline: No thanks
    next: Next
    skip: Skip
    done: I'm ready
    steps:
        intro: "This is the Project database — where we gather the departments' projects in one place, so we can see what's happening across them."
        dashboard: "The overview shows key figures, status and any opportunities for collaboration across departments."
        create: "Browse every project from the Projects menu — or create a new one right away with the Opret button."
        admin: "Inside this menu you'll find Administration, where you can create, view and edit departments, areas, partners and contacts."
        outro: "You're all set! I'm always right here in the corner if you need a tip. 🌟"

